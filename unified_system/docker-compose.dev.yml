services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unified_dev
      POSTGRES_USER: unified_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_dev -d unified_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-development-secret-change-before-use}
      DATABASE_URL: postgresql+psycopg://unified_dev:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/unified_dev
      DATA_DIR: /app/unified_system/data
      COOKIE_SECURE: "0"
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEYS_JSON: ${CREDENTIAL_ENCRYPTION_KEYS_JSON:-}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID:-}
      WORKER_TOKEN_CHAOXING: ${WORKER_TOKEN_CHAOXING:-}
      WORKER_TOKEN_ZHIHUISHU: ${WORKER_TOKEN_ZHIHUISHU:-}
      WORKER_TOKEN_YINGHUA: ${WORKER_TOKEN_YINGHUA:-}
    command: ["sh", "-lc", "flask --app unified_system.app:create_app init-db && flask --app unified_system.app:create_app run --host 0.0.0.0 --port 8088"]
    volumes:
      - unified_dev_data:/app/unified_system/data
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8088
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_dev_data:
  unified_dev_data:
  frontend_node_modules:
