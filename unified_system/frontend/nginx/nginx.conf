worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format safe '$http_x_real_ip [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

    upstream unified_backend {
        server backend:8088;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/snippets/unified-learning-security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Worker service endpoints are private-only and must never pass through a web proxy.
        location = /api/internal/workers {
            return 404;
        }
        location ^~ /api/internal/workers/ {
            return 404;
        }

        # Vite emits content-hashed files under /assets/; keep these immutable across releases.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/unified-learning-security-headers.conf;
        }

        # The SPA entry document must be revalidated after each deployment.
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-store";
            include /etc/nginx/snippets/unified-learning-security-headers.conf;
        }

        location ^~ /api/ {
            proxy_pass http://unified_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_connect_timeout 3s;
            proxy_send_timeout 65s;
            proxy_read_timeout 70s;
            proxy_redirect off;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Content-Security-Policy;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
