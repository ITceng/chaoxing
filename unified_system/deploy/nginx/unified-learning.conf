# Install as an http-context include (for example /etc/nginx/conf.d/unified-learning.conf).
# Replace example.invalid and install a valid certificate before enabling the TLS server.
limit_req_zone $binary_remote_addr zone=unified_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=unified_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=unified_connections:10m;
limit_req_status 429;

log_format unified_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name example.invalid;
    access_log /var/log/nginx/unified-learning.access.log unified_safe;
    error_log /var/log/nginx/unified-learning.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /api/internal/workers { return 404; }
    location ^~ /api/internal/workers/ { return 404; }
    location / { return 308 https://example.invalid$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name example.invalid;

    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:unified_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/unified-learning.access.log unified_safe;
    error_log /var/log/nginx/unified-learning.error.log warn;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api/internal/workers { return 404; }
    location ^~ /api/internal/workers/ { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=unified_login burst=5 nodelay;
        limit_conn unified_connections 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers at the public trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 65s;
        proxy_read_timeout 70s;
        proxy_redirect off;
        proxy_hide_header Strict-Transport-Security;
    }

    location ^~ /api/ {
        limit_req zone=unified_api burst=40 nodelay;
        limit_conn unified_connections 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 65s;
        proxy_read_timeout 70s;
        proxy_redirect off;
        proxy_hide_header Strict-Transport-Security;
    }

    location / {
        limit_conn unified_connections 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 65s;
        proxy_read_timeout 70s;
        proxy_redirect off;
        proxy_hide_header Strict-Transport-Security;
    }
}
